<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TuneQuest</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #overlay {
      width: 1100px;
      max-width: 95vw;
      padding: 36px 44px;
      color: white;
      text-align: center;
      background:
        linear-gradient(
          135deg,
          rgba(15, 15, 25, 0.97),
          rgba(35, 20, 55, 0.97)
        );
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5);
      opacity: 1;
      transition: opacity 1s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #title {
      margin-bottom: 8px;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 8px;
    }

    #status {
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: 700;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    #difficulty {
      display: inline-block;
      margin-bottom: 24px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .reveal-section {
      margin: 10px 0 28px;
    }

    .reveal-label {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 900;
      opacity: 0.65;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #song,
    #artist {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 70px;
      font-weight: 800;
      letter-spacing: 5px;
      word-spacing: 10px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    #song {
      font-size: 46px;
    }

    #artist {
      font-size: 32px;
      opacity: 0.9;
    }

    #year {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 800;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    #stats {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-bottom: 26px;
    }

    .stat {
      min-width: 150px;
    }

    .stat-label {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0.6;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 900;
    }

    #timer {
      font-size: 42px;
      font-weight: 900;
    }

    #message {
      min-height: 32px;
      font-size: 20px;
      font-weight: 700;
      opacity: 0.85;
    }

    #answer {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    #answer-title {
      font-size: 34px;
      font-weight: 900;
    }

    #answer-artist {
      margin-top: 8px;
      font-size: 20px;
      opacity: 0.75;
    }

    #answer-year {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 800;
      opacity: 0.6;
      letter-spacing: 2px;
    }

    /*
     * Round winner panel
     */

    #winner-panel {
      position: fixed;
      left: 30px;
      top: 50%;
      width: 280px;
      padding: 28px 24px;
      transform:
        translateY(-50%)
        translateX(0);
      color: white;
      text-align: center;
      background:
        linear-gradient(
          145deg,
          rgba(20, 20, 30, 0.98),
          rgba(45, 25, 65, 0.98)
        );
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.55);
      opacity: 1;
      transition:
        opacity 1s ease,
        transform 1s ease;
      z-index: 10;
    }

    #winner-panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform:
        translateY(-50%)
        translateX(-25px);
    }

    #winner-title {
      margin-bottom: 18px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    #winner-name {
      margin-bottom: 18px;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    #winner-streak {
      margin-bottom: 10px;
      font-size: 23px;
      font-weight: 900;
    }

    #winner-points {
      font-size: 21px;
      font-weight: 800;
      opacity: 0.9;
    }

    #connection {
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      letter-spacing: 1px;
      z-index: 20;
    }

    @media (
      max-width: 1400px
    ) {
      #winner-panel {
        left: 18px;
        width: 240px;
        padding: 24px 18px;
      }

      #winner-name {
        font-size: 28px;
      }

      #winner-streak {
        font-size: 20px;
      }

      #winner-points {
        font-size: 18px;
      }
    }

    @media (
      max-width: 1000px
    ) {
      #winner-panel {
        left: 50%;
        top: auto;
        bottom: 20px;
        width: 260px;
        transform:
          translateX(-50%)
          translateY(0);
      }

      #winner-panel.hidden {
        transform:
          translateX(-50%)
          translateY(25px);
      }
    }
  </style>
</head>

<body>

  <div id="overlay">

    <div id="title">
      TUNEQUEST
    </div>

    <div id="status">
      Waiting for a round
    </div>

    <div id="difficulty">
      -
    </div>

    <div class="reveal-section">

      <div class="reveal-label">
        Song
      </div>

      <div id="song">
        Ready?
      </div>

    </div>

    <div class="reveal-section">

      <div class="reveal-label">
        Artist
      </div>

      <div id="artist">
        -
      </div>

      <div id="year">
        -
      </div>

    </div>

    <div id="stats">

      <div class="stat">

        <div class="stat-label">
          Time
        </div>

        <div
          class="stat-value"
          id="timer"
        >
          0s
        </div>

      </div>

      <div class="stat">

        <div class="stat-label">
          Letters
        </div>

        <div
          class="stat-value"
          id="letters"
        >
          0/0
        </div>

      </div>

      <div class="stat">

        <div class="stat-label">
          Max Points
        </div>

        <div
          class="stat-value"
          id="points"
        >
          0
        </div>

      </div>

    </div>

    <div id="message">
      Start a round with !tune
    </div>

    <div id="answer">

      <div id="answer-title"></div>

      <div id="answer-artist"></div>

      <div id="answer-year"></div>

    </div>

  </div>

  <div
    id="winner-panel"
    class="hidden"
  >

    <div id="winner-title">
      Round Winner
    </div>

    <div id="winner-name">
      -
    </div>

    <div id="winner-streak">
      🔥 0 STREAK
    </div>

    <div id="winner-points">
      +0 POINTS
    </div>

  </div>

  <div id="connection">
    CONNECTING
  </div>

  <script>
    const overlayElement =
      document.getElementById(
        "overlay"
      );

    const statusElement =
      document.getElementById(
        "status"
      );

    const difficultyElement =
      document.getElementById(
        "difficulty"
      );

    const songElement =
      document.getElementById(
        "song"
      );

    const artistElement =
      document.getElementById(
        "artist"
      );

    const yearElement =
      document.getElementById(
        "year"
      );

    const timerElement =
      document.getElementById(
        "timer"
      );

    const lettersElement =
      document.getElementById(
        "letters"
      );

    const pointsElement =
      document.getElementById(
        "points"
      );

    const messageElement =
      document.getElementById(
        "message"
      );

    const answerElement =
      document.getElementById(
        "answer"
      );

    const answerTitleElement =
      document.getElementById(
        "answer-title"
      );

    const answerArtistElement =
      document.getElementById(
        "answer-artist"
      );

    const answerYearElement =
      document.getElementById(
        "answer-year"
      );

    const winnerPanelElement =
      document.getElementById(
        "winner-panel"
      );

    const winnerNameElement =
      document.getElementById(
        "winner-name"
      );

    const winnerStreakElement =
      document.getElementById(
        "winner-streak"
      );

    const winnerPointsElement =
      document.getElementById(
        "winner-points"
      );

    const connectionElement =
      document.getElementById(
        "connection"
      );

    let socket = null;

    let hideTimer = null;

    let hideWinnerTimer = null;

    function showOverlay() {
      if (hideTimer) {
        clearTimeout(
          hideTimer
        );

        hideTimer = null;
      }

      overlayElement.classList.remove(
        "hidden"
      );
    }

    function hideOverlayAfterDelay() {
      if (hideTimer) {
        clearTimeout(
          hideTimer
        );
      }

      hideTimer = setTimeout(
        () => {
          overlayElement.classList.add(
            "hidden"
          );

          hideTimer = null;
        },
        7000
      );
    }

    function showWinner() {
      if (hideWinnerTimer) {
        clearTimeout(
          hideWinnerTimer
        );

        hideWinnerTimer = null;
      }

      winnerPanelElement.classList.remove(
        "hidden"
      );
    }

    function hideWinner() {
      if (hideWinnerTimer) {
        clearTimeout(
          hideWinnerTimer
        );

        hideWinnerTimer = null;
      }

      winnerPanelElement.classList.add(
        "hidden"
      );
    }

    function hideWinnerAfterDelay() {
      if (hideWinnerTimer) {
        clearTimeout(
          hideWinnerTimer
        );
      }

      hideWinnerTimer = setTimeout(
        () => {
          winnerPanelElement.classList.add(
            "hidden"
          );

          hideWinnerTimer = null;
        },
        7000
      );
    }

    function setConnectionStatus(
      connected
    ) {
      connectionElement.textContent =
        connected
          ? "CONNECTED"
          : "DISCONNECTED";
    }

    function toSafeNumber(
      value,
      fallback = 0
    ) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? number
        : fallback;
    }

    function updateLetters(
      revealedCount,
      totalLetters
    ) {
      const revealed =
        toSafeNumber(
          revealedCount
        );

      const total =
        toSafeNumber(
          totalLetters
        );

      lettersElement.textContent =
        `${revealed}/${total}`;
    }

    function updateYear(
      year
    ) {
      if (
        year === null ||
        year === undefined ||
        year === ""
      ) {
        yearElement.textContent =
          "-";

        return;
      }

      yearElement.textContent =
        year;
    }

    function updateRoundState(
      state
    ) {
      if (!state) {
        return;
      }

      songElement.textContent =
        state.maskedTitle ||
        "Ready?";

      artistElement.textContent =
        state.maskedArtist ||
        "-";

      updateYear(
        state.year
      );

      difficultyElement.textContent =
        state.difficulty
          ? state.difficulty.toUpperCase()
          : "-";

      timerElement.textContent =
        `${toSafeNumber(
          state.remainingSeconds
        )}s`;

      updateLetters(
        state.revealedCount,
        state.totalLetters
      );

      pointsElement.textContent =
        `${toSafeNumber(
          state.maxPoints
        )}`;

      if (state.active) {
        showOverlay();
        hideWinner();

        statusElement.textContent =
          "Guess the song";

        messageElement.textContent =
          "Letters are being revealed...";
      }
    }

    function displayWinner(
      winner
    ) {
      if (!winner) {
        hideWinner();

        return;
      }

      winnerNameElement.textContent =
        winner.username ||
        "Unknown";

      const streak =
        toSafeNumber(
          winner.streak
        );

      const points =
        toSafeNumber(
          winner.points
        );

      winnerStreakElement.textContent =
        `🔥 ${streak} STREAK`;

      winnerPointsElement.textContent =
        `+${points} POINTS`;

      showWinner();
      hideWinnerAfterDelay();
    }

    function handleMessage(
      message
    ) {
      if (!message) {
        return;
      }

      if (
        message.type ===
        "state"
      ) {
        updateRoundState(
          message.state
        );

        if (
          message.state &&
          !message.state.active
        ) {
          hideWinner();

          statusElement.textContent =
            "Waiting for a round";

          difficultyElement.textContent =
            "-";

          songElement.textContent =
            "Ready?";

          artistElement.textContent =
            "-";

          updateYear(
            null
          );

          messageElement.textContent =
            "Start a round with !tune";
        }

        return;
      }

      if (
        message.type ===
        "round_started"
      ) {
        showOverlay();
        hideWinner();

        updateRoundState(
          message.state
        );

        answerElement.style.display =
          "none";

        statusElement.textContent =
          "Guess the song";

        messageElement.textContent =
          "Letters are being revealed...";

        return;
      }

      if (
        message.type ===
        "timer"
      ) {
        timerElement.textContent =
          `${toSafeNumber(
            message.remainingSeconds
          )}s`;

        return;
      }

      if (
        message.type ===
        "letter_revealed"
      ) {
        showOverlay();

        songElement.textContent =
          message.maskedTitle ||
          songElement.textContent;

        artistElement.textContent =
          message.maskedArtist ||
          artistElement.textContent;

        updateLetters(
          message.revealedCount,
          message.totalLetters
        );

        if (
          message.maxPoints !==
          undefined
        ) {
          pointsElement.textContent =
            `${toSafeNumber(
              message.maxPoints
            )}`;
        }

        return;
      }

      if (
        message.type ===
        "round_ended"
      ) {
        showOverlay();

        statusElement.textContent =
          "Round Over";

        timerElement.textContent =
          "0s";

        updateLetters(
          message.state
            ? message.state.revealedCount
            : 0,
          message.state
            ? message.state.totalLetters
            : 0
        );

        songElement.textContent =
          message.answer ||
          "Round Over";

        artistElement.textContent =
          message.artist ||
          "-";

        updateYear(
          message.year
        );

        pointsElement.textContent =
          "0";

        answerTitleElement.textContent =
          message.answer ||
          "";

        answerArtistElement.textContent =
          message.artist ||
          "";

        updateYear(
          message.year
        );

        answerYearElement.textContent =
          message.year
            ? `Released ${message.year}`
            : "";

        answerElement.style.display =
          "block";

        /*
         * Only a correct guess creates
         * a round winner.
         */
        if (
          message.reason ===
            "correct_guess" &&
          message.winner
        ) {
          messageElement.textContent =
            `${message.winner.username} guessed it for ${message.winner.points} points!`;

          displayWinner(
            message.winner
          );
        } else {
          hideWinner();

          if (
            message.reason ===
            "all_letters_revealed"
          ) {
            messageElement.textContent =
              "All letters revealed!";
          } else if (
            message.reason ===
            "skipped"
          ) {
            messageElement.textContent =
              "Round skipped.";
          } else {
            messageElement.textContent =
              "Time's up!";
          }
        }

        /*
         * Keep the completed round visible
         * for 7 seconds before fading it out.
         */
        hideOverlayAfterDelay();

        return;
      }
    }

    function connect() {
      const protocol =
        window.location.protocol ===
        "https:"
          ? "wss:"
          : "ws:";

      socket =
        new WebSocket(
          `${protocol}//${window.location.host}`
        );

      socket.addEventListener(
        "open",
        () => {
          setConnectionStatus(
            true
          );
        }
      );

      socket.addEventListener(
        "message",
        (event) => {
          try {
            const message =
              JSON.parse(
                event.data
              );

            handleMessage(
              message
            );
          } catch (error) {
            console.error(
              "Invalid WebSocket message:",
              error
            );
          }
        }
      );

      socket.addEventListener(
        "close",
        () => {
          setConnectionStatus(
            false
          );

          setTimeout(
            connect,
            2000
          );
        }
      );

      socket.addEventListener(
        "error",
        () => {
          setConnectionStatus(
            false
          );
        }
      );
    }

    async function loadInitialState() {
      try {
        const response =
          await fetch(
            "/api/state"
          );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const state =
          await response.json();

        updateRoundState(
          state
        );

        if (!state.active) {
          hideWinner();

          statusElement.textContent =
            "Waiting for a round";

          difficultyElement.textContent =
            "-";

          songElement.textContent =
            "Ready?";

          artistElement.textContent =
            "-";

          updateYear(
            null
          );

          messageElement.textContent =
            "Start a round with !tune";
        }
      } catch (error) {
        console.error(
          "Failed to load initial state:",
          error
        );
      }
    }

    loadInitialState();

    connect();
  </script>

</body>
</html>
