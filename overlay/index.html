<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TuneQuest</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #overlay {
      width: 1100px;
      max-width: 95vw;
      padding: 36px 44px;
      color: white;
      text-align: center;
      background:
        linear-gradient(
          135deg,
          rgba(15, 15, 25, 0.97),
          rgba(35, 20, 55, 0.97)
        );
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5);

      opacity: 0;
      visibility: hidden;
      transition:
        opacity 1s ease,
        visibility 1s ease;
    }

    #overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    #title {
      margin-bottom: 8px;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 8px;
    }

    #status {
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: 700;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    #difficulty {
      display: inline-block;
      margin-bottom: 24px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #song {
      min-height: 100px;
      margin: 10px 0 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 5px;
      word-spacing: 10px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    #stats {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-bottom: 26px;
    }

    .stat {
      min-width: 150px;
    }

    .stat-label {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0.6;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 900;
    }

    #timer {
      font-size: 42px;
      font-weight: 900;
    }

    #message {
      min-height: 32px;
      font-size: 20px;
      font-weight: 700;
      opacity: 0.85;
    }

    #answer {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    #answer-title {
      font-size: 34px;
      font-weight: 900;
    }

    #answer-artist {
      margin-top: 8px;
      font-size: 20px;
      opacity: 0.75;
    }

    #connection {
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      letter-spacing: 1px;

      opacity: 0;
      visibility: hidden;
      transition:
        opacity 1s ease,
        visibility 1s ease;
    }

    #connection.visible {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>

<body>

  <div id="overlay">

    <div id="title">
      TUNEQUEST
    </div>

    <div id="status">
      Waiting for a round
    </div>

    <div id="difficulty">
      -
    </div>

    <div id="song">
      Ready?
    </div>

    <div id="stats">

      <div class="stat">
        <div class="stat-label">
          Time
        </div>

        <div
          class="stat-value"
          id="timer"
        >
          0s
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Letters
        </div>

        <div
          class="stat-value"
          id="letters"
        >
          0/0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Max Points
        </div>

        <div
          class="stat-value"
          id="points"
        >
          0
        </div>
      </div>

    </div>

    <div id="message">
      Start a round with !tune
    </div>

    <div id="answer">

      <div
        id="answer-title"
      ></div>

      <div
        id="answer-artist"
      ></div>

    </div>

  </div>

  <div id="connection">
    CONNECTING
  </div>

  <script>
    const overlayElement =
      document.getElementById(
        "overlay"
      );

    const statusElement =
      document.getElementById(
        "status"
      );

    const difficultyElement =
      document.getElementById(
        "difficulty"
      );

    const songElement =
      document.getElementById(
        "song"
      );

    const timerElement =
      document.getElementById(
        "timer"
      );

    const lettersElement =
      document.getElementById(
        "letters"
      );

    const pointsElement =
      document.getElementById(
        "points"
      );

    const messageElement =
      document.getElementById(
        "message"
      );

    const answerElement =
      document.getElementById(
        "answer"
      );

    const answerTitleElement =
      document.getElementById(
        "answer-title"
      );

    const answerArtistElement =
      document.getElementById(
        "answer-artist"
      );

    const connectionElement =
      document.getElementById(
        "connection"
      );

    let socket = null;
    let hideTimer = null;

    const ROUND_END_DISPLAY_MS = 7000;

    function setOverlayVisible(
      visible
    ) {
      if (visible) {
        overlayElement.classList.add(
          "visible"
        );

        connectionElement.classList.add(
          "visible"
        );

        return;
      }

      overlayElement.classList.remove(
        "visible"
      );

      connectionElement.classList.remove(
        "visible"
      );
    }

    function cancelHideTimer() {
      if (hideTimer) {
        clearTimeout(hideTimer);
        hideTimer = null;
      }
    }

    function scheduleOverlayHide() {
      cancelHideTimer();

      hideTimer = setTimeout(() => {
        setOverlayVisible(false);
        hideTimer = null;
      }, ROUND_END_DISPLAY_MS);
    }

    function setConnectionStatus(
      connected
    ) {
      connectionElement.textContent =
        connected
          ? "CONNECTED"
          : "DISCONNECTED";
    }

    function toSafeNumber(
      value,
      fallback = 0
    ) {
      const number =
        Number(value);

      return Number.isFinite(number)
        ? number
        : fallback;
    }

    function updateLetters(
      revealedCount,
      totalLetters
    ) {
      const revealed =
        toSafeNumber(
          revealedCount
        );

      const total =
        toSafeNumber(
          totalLetters
        );

      lettersElement.textContent =
        `${revealed}/${total}`;
    }

    function updateRoundState(
      state
    ) {
      if (!state) {
        return;
      }

      if (state.active) {
        cancelHideTimer();
        setOverlayVisible(true);
      }

      songElement.textContent =
        state.maskedTitle ||
        "Ready?";

      difficultyElement.textContent =
        state.difficulty
          ? state.difficulty.toUpperCase()
          : "-";

      timerElement.textContent =
        `${toSafeNumber(
          state.remainingSeconds
        )}s`;

      updateLetters(
        state.revealedCount,
        state.totalLetters
      );

      pointsElement.textContent =
        `${toSafeNumber(
          state.maxPoints
        )}`;

      if (state.active) {
        statusElement.textContent =
          "Guess the song";

        messageElement.textContent =
          "Letters are being revealed...";
      }
    }

    function handleMessage(
      message
    ) {
      if (!message) {
        return;
      }

      if (
        message.type === "state"
      ) {
        updateRoundState(
          message.state
        );

        if (
          message.state &&
          !message.state.active
        ) {
          setOverlayVisible(false);

          statusElement.textContent =
            "Waiting for a round";

          songElement.textContent =
            "Ready?";

          messageElement.textContent =
            "Start a round with !tune";
        }

        return;
      }

      if (
        message.type ===
        "round_started"
      ) {
        cancelHideTimer();
        setOverlayVisible(true);

        updateRoundState(
          message.state
        );

        answerElement.style.display =
          "none";

        statusElement.textContent =
          "Guess the song";

        messageElement.textContent =
          "Letters are being revealed...";

        return;
      }

      if (
        message.type === "timer"
      ) {
        timerElement.textContent =
          `${toSafeNumber(
            message.remainingSeconds
          )}s`;

        return;
      }

      if (
        message.type ===
        "letter_revealed"
      ) {
        setOverlayVisible(true);

        songElement.textContent =
          message.maskedTitle ||
          songElement.textContent;

        updateLetters(
          message.revealedCount,
          message.totalLetters
        );

        pointsElement.textContent =
          `${toSafeNumber(
            message.maxPoints
          )}`;

        return;
      }

      if (
        message.type ===
        "round_ended"
      ) {
        cancelHideTimer();

        setOverlayVisible(true);

        statusElement.textContent =
          "Round Over";

        timerElement.textContent =
          "0s";

        updateLetters(
          message.state
            ? message.state.revealedCount
            : 0,
          message.state
            ? message.state.totalLetters
            : 0
        );

        songElement.textContent =
          message.answer ||
          message.songTitle ||
          "Round Over";

        pointsElement.textContent =
          "0";

        answerTitleElement.textContent =
          message.answer ||
          message.songTitle ||
          "";

        answerArtistElement.textContent =
          message.artist || "";

        answerElement.style.display =
          "block";

        if (
          message.reason ===
          "all_letters_revealed"
        ) {
          messageElement.textContent =
            "All letters revealed!";
        } else if (
          message.reason ===
          "correct_guess"
        ) {
          if (
            message.winner
          ) {
            messageElement.textContent =
              `${message.winner.username} guessed it for ${message.winner.points} points!`;
          } else {
            messageElement.textContent =
              "Correct guess!";
          }
        } else if (
          message.reason ===
          "skipped"
        ) {
          messageElement.textContent =
            "Round skipped.";
        } else {
          messageElement.textContent =
            "Time's up!";
        }

        scheduleOverlayHide();

        return;
      }
    }

    function connect() {
      const protocol =
        window.location.protocol ===
        "https:"
          ? "wss:"
          : "ws:";

      socket =
        new WebSocket(
          `${protocol}//${window.location.host}`
        );

      socket.addEventListener(
        "open",
        () => {
          setConnectionStatus(
            true
          );
        }
      );

      socket.addEventListener(
        "message",
        (event) => {
          try {
            const message =
              JSON.parse(
                event.data
              );

            handleMessage(
              message
            );
          } catch (error) {
            console.error(
              "Invalid WebSocket message:",
              error
            );
          }
        }
      );

      socket.addEventListener(
        "close",
        () => {
          setConnectionStatus(
            false
          );

          setTimeout(
            connect,
            2000
          );
        }
      );

      socket.addEventListener(
        "error",
        () => {
          setConnectionStatus(
            false
          );
        }
      );
    }

    async function loadInitialState() {
      try {
        const response =
          await fetch(
            "/api/state"
          );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const state =
          await response.json();

        updateRoundState(
          state
        );

        if (!state.active) {
          setOverlayVisible(false);

          statusElement.textContent =
            "Waiting for a round";

          songElement.textContent =
            "Ready?";

          messageElement.textContent =
            "Start a round with !tune";
        }
      } catch (error) {
        console.error(
          "Failed to load initial state:",
          error
        );

        setOverlayVisible(false);
      }
    }

    setOverlayVisible(false);

    loadInitialState();

    connect();
  </script>

</body>
</html>
